name: Daily ARAS profile photo audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily photo audit
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
          PROFILE_AUDIT_CRON_SECRET: ${{ secrets.PROFILE_AUDIT_CRON_SECRET }}
        run: |
          if [ -z "$APPLICATION_URL" ] || [ -z "$PROFILE_AUDIT_CRON_SECRET" ]; then
            echo "Configure the APPLICATION_URL variable and PROFILE_AUDIT_CRON_SECRET repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "${APPLICATION_URL%/}/api/cron/profile-photo-audit" \
            --header "Authorization: Bearer $PROFILE_AUDIT_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
