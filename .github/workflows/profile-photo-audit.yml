name: Daily ARAS profile photo audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: ARAS_APPLICATION_URL
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Scan profile photos with Google Vision
        env:
          ARAS_APPLICATION_URL: ${{ vars.ARAS_APPLICATION_URL }}
          PHOTO_AUDIT_CRON_SECRET: ${{ secrets.PHOTO_AUDIT_CRON_SECRET }}
        run: node scripts/run-profile-photo-audit.mjs
