  <body><main><img src="/icons/icon-192.png" alt="ARAS"><h1>Tu es hors connexion</h1><p>Reconnecte-toi à Internet pour retrouver ton espace, tes messages et les dernières informations ARAS.</p><button type="button" onclick="location.reload()">Réessayer</button></main></body>
